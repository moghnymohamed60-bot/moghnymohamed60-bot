<svg xmlns="http://www.w3.org/2000/svg" width="480" height="180" viewBox="0 0 480 180" fill="none">
  <!-- Card Background -->
  <rect width="480" height="180" rx="12" fill="#090E1A" stroke="#1F293D" stroke-width="1.5"/>
  
  <!-- Top Header Dot & Path -->
  <text x="24" y="24" font-family="monospace" font-size="11" fill="#8B949E">• moghnymohamed60-bot/Travel-Reimbursement-System</text>
  <circle cx="456" cy="21" r="4" fill="#3178C6"/>
  
  <!-- Icon Container -->
  <rect x="24" y="44" width="52" height="52" rx="10" fill="#0D1117" stroke="#21262D" stroke-width="1.5"/>
  <!-- Briefcase Icon -->
  <g transform="translate(38, 58)">
    <rect x="2" y="5" width="12" height="9" rx="1" stroke="#58A6FF" stroke-width="1.2" fill="none"/>
    <path d="M5 5V3.5A1 1 0 0 1 6 2.5h4a1 1 0 0 1 1 1V5" stroke="#58A6FF" stroke-width="1.2" fill="none"/>
    <path d="M2 8h12" stroke="#58A6FF" stroke-width="1.2"/>
  </g>
  
  <!-- Title -->
  <text x="90" y="66" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="17" font-weight="bold" fill="#FFFFFF">Travel-Reimbursement-System_</text>
  
  <!-- Tagline / Description -->
  <text x="90" y="88" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#8B949E">Travel expense logging portal featuring receipt submissions,</text>
  <text x="90" y="104" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#8B949E">manager approvals, and automated billing workflows.</text>
  
  <!-- Tag Pills -->
  <rect x="90" y="118" width="82" height="20" rx="10" fill="#1C1B2D" stroke="#A78BFA" stroke-width="0.5"/>
  <text x="131" y="132" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" fill="#A78BFA" text-anchor="middle">TypeScript</text>
  
  <rect x="178" y="118" width="62" height="20" rx="10" fill="#1C1B2D" stroke="#A78BFA" stroke-width="0.5"/>
  <text x="209" y="132" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" fill="#A78BFA" text-anchor="middle">Node.js</text>
  
  <!-- Footer Stars & Date -->
  <text x="90" y="156" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#8B949E">★ 0    updated 1d ago</text>
  
  <!-- Divider -->
  <line x1="330" y1="36" x2="330" y2="144" stroke="#1F293D" stroke-width="1.5"/>
  
  <!-- Languages List -->
  <circle cx="346" cy="62" r="3.5" fill="#3178C6"/>
  <text x="356" y="66" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#8B949E">TS 85%</text>
  
  <circle cx="346" cy="80" r="3.5" fill="#F7DF1E"/>
  <text x="356" y="84" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#8B949E">JS 10%</text>
  
  <circle cx="346" cy="98" r="3.5" fill="#563D7C"/>
  <text x="356" y="102" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#8B949E">CSS 5%</text>
  
  <!-- Donut Chart -->
  <circle cx="430" cy="90" r="15.915" stroke="#161B22" stroke-width="3.5" fill="none"/>
  <circle cx="430" cy="90" r="15.915" stroke="#3178C6" stroke-width="3.5" stroke-dasharray="85 15" stroke-dashoffset="0" fill="none" transform="rotate(-90 430 90)"/>
  <circle cx="430" cy="90" r="15.915" stroke="#F7DF1E" stroke-width="3.5" stroke-dasharray="10 90" stroke-dashoffset="-85" fill="none" transform="rotate(-90 430 90)"/>
  <circle cx="430" cy="90" r="15.915" stroke="#563D7C" stroke-width="3.5" stroke-dasharray="5 95" stroke-dashoffset="-95" fill="none" transform="rotate(-90 430 90)"/>
  <text x="430" y="93" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="8.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">85%</text>
