<svg xmlns="http://www.w3.org/2000/svg" width="480" height="180" viewBox="0 0 480 180" fill="none">
  <!-- Card Background -->
  <rect width="480" height="180" rx="12" fill="#090E1A" stroke="#1F293D" stroke-width="1.5"/>
  
  <!-- Top Header Dot & Path -->
  <text x="24" y="24" font-family="monospace" font-size="11" fill="#8B949E">• moghnymohamed60-bot/Restaurant-Reservation-System</text>
  <circle cx="456" cy="21" r="4" fill="#B07219"/>
  
  <!-- Icon Container -->
  <rect x="24" y="44" width="52" height="52" rx="10" fill="#0D1117" stroke="#21262D" stroke-width="1.5"/>
  <!-- Diner Icon -->
  <g transform="translate(42, 62)">
    <circle cx="8" cy="8" r="5" stroke="#10B981" stroke-width="1.2" fill="none"/>
    <path d="M4 13h8" stroke="#10B981" stroke-width="1.2" fill="none"/>
    <path d="M8 3a2 2 0 0 0-2 2h4a2 2 0 0 0-2-2Z" fill="#10B981"/>
  </g>
  
  <!-- Title -->
  <text x="90" y="66" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="17" font-weight="bold" fill="#FFFFFF">Restaurant-Reservation-System_</text>
  
  <!-- Tagline / Description -->
  <text x="90" y="88" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#8B949E">Interactive seating and reservation app featuring table</text>
  <text x="90" y="104" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#8B949E">bookings, real-time allocations, and staff schedules.</text>
  
  <!-- Tag Pills -->
  <rect x="90" y="118" width="48" height="20" rx="10" fill="#1C1B2D" stroke="#A78BFA" stroke-width="0.5"/>
  <text x="114" y="132" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" fill="#A78BFA" text-anchor="middle">Java</text>
  
  <rect x="144" y="118" width="76" height="20" rx="10" fill="#1C1B2D" stroke="#A78BFA" stroke-width="0.5"/>
  <text x="182" y="132" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" fill="#A78BFA" text-anchor="middle">Spring Boot</text>
  
  <!-- Footer Stars & Date -->
  <text x="90" y="156" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#8B949E">★ 0    updated 1d ago</text>
  
  <!-- Divider -->
  <line x1="330" y1="36" x2="330" y2="144" stroke="#1F293D" stroke-width="1.5"/>
  
  <!-- Languages List -->
  <circle cx="346" cy="62" r="3.5" fill="#B07219"/>
  <text x="356" y="66" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#8B949E">Java 90%</text>
  
  <circle cx="346" cy="80" r="3.5" fill="#E38C00"/>
  <text x="356" y="84" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#8B949E">SQL 10%</text>
  
  <!-- Donut Chart -->
  <circle cx="430" cy="90" r="15.915" stroke="#161B22" stroke-width="3.5" fill="none"/>
  <circle cx="430" cy="90" r="15.915" stroke="#B07219" stroke-width="3.5" stroke-dasharray="90 10" stroke-dashoffset="0" fill="none" transform="rotate(-90 430 90)"/>
  <circle cx="430" cy="90" r="15.915" stroke="#E38C00" stroke-width="3.5" stroke-dasharray="10 90" stroke-dashoffset="-90" fill="none" transform="rotate(-90 430 90)"/>
  <text x="430" y="93" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="8.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">90%</text>
</svg>